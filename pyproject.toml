[project]
name = "jonathanstegall-api"
version = "0.1.0"
description = "API for storing and accessing data from other sources"
readme = "README.md"
authors = [
    { name = "Jonathan Stegall", email = "hello@jonathanstegall.com" }
]
requires-python = ">=3.15"
dependencies = [
    "alembic==1.20.1",
    "click==8.5.1",
    "fastapi[standard]==0.165.0",
    "gunicorn==27.0.1",
    "loguru==0.8.0",
    "passlib[bcrypt]==1.7.4",
    "pydantic==2.14.4",
    "pydantic-settings==2.16.3",
    "python-jose[cryptography]==3.5.0",
    "psycopg[binary]==3.3.9",
    "redis==8.1.0",
    "requests==2.34.2",
    "sentry-sdk[fastapi]==2.75.0",
    "sqlalchemy==2.1.9",
    "sqlmodel==0.0.50",
    "uvicorn[standard]==0.54.0",
]

[tool.fastapi]
entrypoint = "app.main:app"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
